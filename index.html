<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máquinas industriales · venta minimal</title>

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- TU CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="wrapper">
  <header>
    <div class="logo">
      <h1>INDUSTRIAL·MIN</h1>
      <span>maquinaria robusta / diseño simple</span>
    </div>

    <div class="cart-summary" id="cartSummaryBtn">
      <a href="">  
      <i class="fa-solid fa-user" ></i>
      </a>
      <i class="fas fa-basket-shopping"></i>
      <span class="count" id="cartCount">0</span>
      <span class="total" id="cartTotal">0€</span>
    </div>
  </header>

  <div class="main-panel">
    <section class="catalog">
      <h2>Máquinas disponibles</h2>
      <div class="machine-grid" id="machineGrid"></div>
    </section>

    <aside class="cart-side" id="cartSide">
      <h2><i class="fas fa-basket-shopping" style="margin-right: 0.5rem;"></i> Carrito</h2>
      <ul class="cart-items" id="cartList"></ul>
      <div class="cart-total">
        <span>Total</span>
        <span id="cartSideTotal">0€</span>
      </div>
      <button class="clear-cart" id="clearCartBtn">
        <i class="fas fa-trash-alt"></i> Vaciar carrito
      </button>
      <p class="checkout-note">
        <i class="far fa-credit-card"></i> Simulación de compra — sin procesar
      </p>
    </aside>
  </div>

  <footer>
    <p>© máquinas industriales — exposición funcional · carrito persistente con JS</p>
  </footer>
</div>

<!-- TU JS -->
<script src="script.js"></script>
</body>
</html>
