<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Tienda Virtual</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #616163 0%, #a04220 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            transition: transform 0.3s ease;
        }
        
        h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #616163 0%, #a04220 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 32px;
            border-left: 3px solid #a04220;
            padding-left: 12px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #4a4a4a;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label i {
            color: #a04220;
            margin-right: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            background: #fafafa;
            font-family: 'Inter', sans-serif;
        }

        input:focus {
            border-color: #a04220;
            background: white;
            box-shadow: 0 0 0 4px rgba(160, 66, 32, 0.1);
        }

        .forgot-password {
            text-align: right;
            margin: 8px 0 24px;
        }

        .forgot-password a {
            color: #a04220;
            font-size: 13px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .forgot-password a:hover {
            color: #616163;
            text-decoration: underline;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #616163 0%, #a04220 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(160, 66, 32, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #a04220;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: all 0.3s ease;
        }

        .register-link a:hover {
            color: #616163;
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0 20px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e0e0e0, transparent);
        }

        .divider-text {
            padding: 0 12px;
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #e0e0e0;
        }

        .social-icon:hover {
            background: linear-gradient(135deg, #616163 0%, #a04220 100%);
            color: white;
            transform: translateY(-3px);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            color: #999;
            text-decoration: none;
            line-height: 1;
            transition: all 0.3s ease;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: 300;
        }

        .close-btn:hover {
            color: #a04220;
            background: rgba(160, 66, 32, 0.1);
            transform: scale(1.1);
        }

        /* Mensaje de error */
        .error-message {
            display: none;
            background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
            color: #dc2626;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
            border-left: 4px solid #dc2626;
            font-weight: 500;
        }

        /* Loader/spinner */
        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Badge de tipo de usuario (opcional) */
        .user-badge {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 12px;
            color: #999;
        }

        .user-badge i {
            color: #a04220;
            margin: 0 4px;
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <a href="index.html" class="close-btn" aria-label="Cerrar">×</a>
            <h1><i class="fas fa-store"></i> Bienvenido</h1>
            <div class="subtitle">Accede a tu tienda virtual</div>

            <!-- Mensaje de error -->
            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email o Usuario</label>
                    <input 
                        type="text" 
                        id="email" 
                        name="email" 
                        placeholder="tu@email.com o usuario" 
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="input-group">
                    <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                        autocomplete="current-password"
                    >
                </div>

                <div class="forgot-password">
                    <a href="#"><i class="fas fa-key"></i> ¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Iniciar sesión
                </button>

                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-text">o continúa con</span>
                    <span class="divider-line"></span>
                </div>

                <div class="social-icons">
                    <a href="#" class="social-icon" aria-label="Google">
                        <i class="fab fa-google"></i>
                    </a>
                    <a href="#" class="social-icon" aria-label="Facebook">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <a href="#" class="social-icon" aria-label="Apple">
                        <i class="fab fa-apple"></i>
                    </a>
                </div>

                <div class="register-link">
                    ¿No tienes cuenta? <a href="RegistroUsuario.html">Regístrate aquí</a>
                </div>
                
                <div class="user-badge">
                    <i class="fas fa-shield-alt"></i> Acceso seguro · <i class="fas fa-store"></i> Tu tienda de confianza
                </div>
            </form>
        </div>
    </div>

    <script>
        // Obtener elementos del DOM
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessageDiv = document.getElementById('errorMessage');

        // La URL de tu backend
        const API_URL = 'http://localhost:3000';

        // Credenciales de ejemplo para mostrar (solo para desarrollo)
        const demoCredentials = {
            admin: { email: 'admin@tienda.com', password: 'admin123' },
            cliente: { email: 'carlos@email.com', password: 'cliente123' }
        };

        // Función para mostrar mensajes de error
        function showError(message) {
            errorMessageDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
            errorMessageDiv.style.display = 'block';
            
            // Ocultar el error después de 4 segundos
            setTimeout(() => {
                errorMessageDiv.style.display = 'none';
            }, 4000);
        }

        // Función para ocultar error
        function hideError() {
            errorMessageDiv.style.display = 'none';
        }

        // Función para mostrar loading en el botón
        function setLoading(isLoading) {
            if (isLoading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loader"></span> Verificando credenciales...';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Iniciar sesión';
            }
        }

        // Función principal de login con detección automática
        async function handleLogin(e) {
            e.preventDefault(); // Evitar que el formulario se envíe normalmente
            
            // Ocultar error anterior
            hideError();
            
            // Obtener valores y limpiarlos
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            
            // Validar que no estén vacíos
            if (!email || !password) {
                showError('⚠️ Por favor completa todos los campos');
                return;
            }
            
            // Mostrar loading
            setLoading(true);
            
            try {
                // 🔑 Hacer la petición al backend
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email: email,
                        password: password 
                    })
                });
                
                // Obtener la respuesta como JSON
                const data = await response.json();
                
                // Verificar si el login fue exitoso
                if (response.ok && data.success) {
                    // Obtener el tipo de usuario automáticamente
                    const usuarioTipo = data.usuario.tipo;
                    const usuarioNombre = data.usuario.nombre;
                    
                    // Guardar datos del usuario en sessionStorage
                    sessionStorage.setItem('usuario', JSON.stringify(data.usuario));
                    sessionStorage.setItem('token', 'logged_in');
                    sessionStorage.setItem('loginTime', new Date().getTime());
                    sessionStorage.setItem('userType', usuarioTipo);
                    
                    console.log(`✅ Login exitoso como ${usuarioTipo}: ${usuarioNombre}`);
                    
                    // Mostrar mensaje de bienvenida temporal
                    mostrarMensajeBienvenida(usuarioNombre, usuarioTipo);
                    
                    // Redirigir automáticamente según el tipo de usuario
                    setTimeout(() => {
                        if (usuarioTipo === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'cliente_dashboard.html';
                        }
                    }, 500);
                    
                } else {
                    // Mostrar mensaje de error del backend
                    showError(data.message || '❌ Credenciales incorrectas. Verifica tu email y contraseña.');
                }
                
            } catch (error) {
                console.error('❌ Error de conexión:', error);
                showError(`🔌 Error de conexión con el servidor. Asegúrate de que el backend esté corriendo en ${API_URL}`);
            } finally {
                // Ocultar loading después de la redirección
                setTimeout(() => {
                    setLoading(false);
                }, 1000);
            }
        }
        
        // Función para mostrar mensaje de bienvenida temporal
        function mostrarMensajeBienvenida(nombre, tipo) {
            const mensaje = document.createElement('div');
            mensaje.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #10b981 0%, #059669 100%);
                color: white;
                padding: 15px 20px;
                border-radius: 12px;
                font-weight: 600;
                z-index: 10000;
                animation: slideIn 0.3s ease;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            `;
            mensaje.innerHTML = `<i class="fas fa-check-circle"></i> ¡Bienvenido ${nombre}! Redirigiendo al panel de ${tipo === 'admin' ? 'administración' : 'cliente'}...`;
            document.body.appendChild(mensaje);
            
            setTimeout(() => {
                mensaje.remove();
            }, 2000);
        }
        
        // Agregar event listener al formulario
        loginForm.addEventListener('submit', handleLogin);
        
        // Agregar efecto de placeholder flotante (opcional)
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.classList.remove('focused');
                }
            });
        });
        
        // Verificar conexión con el backend al cargar la página
        async function checkBackendConnection() {
            try {
                const response = await fetch(`${API_URL}/api/productos`);
                if (response.ok) {
                    console.log('✅ Backend conectado correctamente');
                    // Mostrar indicador de conexión exitosa
                    const indicator = document.createElement('div');
                    indicator.style.cssText = `
                        position: fixed;
                        bottom: 20px;
                        left: 20px;
                        background: #10b981;
                        color: white;
                        padding: 5px 12px;
                        border-radius: 20px;
                        font-size: 12px;
                        z-index: 10000;
                    `;
                    indicator.innerHTML = '<i class="fas fa-circle"></i> Servidor conectado';
                    document.body.appendChild(indicator);
                    setTimeout(() => indicator.remove(), 3000);
                }
            } catch (error) {
                console.warn('⚠️ Backend no disponible:', error);
                showError('⚠️ El servidor no está disponible. Asegúrate de ejecutar "npm start" en el backend');
            }
        }
        
        // Agregar atajos de teclado (Enter ya funciona con el form)
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && document.activeElement === passwordInput) {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
        
        // Limpiar cualquier sesión previa al cargar la página de login
        sessionStorage.removeItem('usuario');
        sessionStorage.removeItem('token');
        sessionStorage.removeItem('loginTime');
        sessionStorage.removeItem('userType');
        
        // Verificar conexión al cargar la página
        window.onload = () => {
            console.log('🔐 Página de login cargada - Sistema listo');
            checkBackendConnection();
            
            // Enfocar automáticamente el campo de email
            emailInput.focus();
            
            // Opcional: Mostrar credenciales de prueba en consola (solo desarrollo)
            console.log('📝 Credenciales de prueba:');
            console.log('   Admin: admin@tienda.com / admin123');
            console.log('   Cliente: carlos@email.com / cliente123');
        };
    </script>
</body>
</html>
