<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Tienda Virtual</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <a href="index.html" class="close-btn" aria-label="Cerrar">×</a>
            <h1>Bienvenido</h1>
            <div class="subtitle">Accede a tu tienda virtual</div>

            <form action="#" method="post">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="tu@email.com" 
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                    >
                </div>

                <div class="forgot-password">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit">Iniciar sesión</button>

                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-text">o continúa con</span>
                    <span class="divider-line"></span>
                </div>

                <div class="social-icons">
                    <a href="#" class="social-icon" aria-label="Google">G</a>
                    <a href="#" class="social-icon" aria-label="Facebook">f</a>
                    <a href="#" class="social-icon" aria-label="Apple">A</a>
                </div>

                <div class="register-link">
                    ¿No tienes cuenta? <a href="RegstroUsuario.html">Regístrate</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
